services:
  backend:
    build:
      context: ./be
    restart: unless-stopped
    networks:
      - default
      - coolify
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./fe
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

volumes:
  backend-uploads:

networks:
  coolify:
    external: true
